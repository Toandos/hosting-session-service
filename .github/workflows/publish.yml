name: Publish

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/toandos/hosting-session-service:${{ inputs.version }}

  chart:
    runs-on: ubuntu-latest

    steps:
      - name: Install helm
        uses: azure/setup-helm@v5

      - name: Package Helm chart
        run: |
          helm package ./chart \
            --version "${{ inputs.version }}" \
            --app-version "${{ inputs.version }}"

      - name: Push Helm chart
        run: |
          helm push \
            "hosting-session-service-${{ inputs.version }}.tgz" \
            oci://ghcr.io/toandos/charts