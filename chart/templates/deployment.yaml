apiVersion: apps/v1
kind: Deployment
metadata:
  name: hosting-session-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hosting-session-service
  template:
    metadata:
      labels:
        app: hosting-session-service
    spec:
      containers:
        - name: hosting-session-service
          image: ghcr.io/toandos/hosting-session-service:{{ .Chart.AppVersion }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1Gi"